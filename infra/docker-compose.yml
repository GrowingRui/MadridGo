# MadridGo local development stack.
# Usage (from repo root):  docker compose -f infra/docker-compose.yml --env-file .env up -d --build
name: madridgo

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-madridgo}
      POSTGRES_USER: ${POSTGRES_USER:-madridgo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"   # localhost only
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]  # cache only, no persistence
    ports:
      - "127.0.0.1:6379:6379"   # localhost only
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ../services/api
    environment:
      MADRIDGO_ENVIRONMENT: ${MADRIDGO_ENVIRONMENT:-development}
      MADRIDGO_DATABASE_URL: postgresql://${POSTGRES_USER:-madridgo}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-madridgo}
      MADRIDGO_REDIS_URL: redis://redis:6379/0
      MADRIDGO_CORS_ORIGINS: ${MADRIDGO_CORS_ORIGINS:-http://localhost:8081}
    ports:
      # Exposed on the LAN so a phone running the Expo app can reach it during development.
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # OpenTripPlanner (Phase 2). Inputs come from `python -m app.ingest otp-prepare` (data/otp/).
  # Build the graph once per data update:
  #   docker compose -f infra/docker-compose.yml --profile otp-build run --rm otp-build
  # Then serve it (http://127.0.0.1:8080):
  #   docker compose -f infra/docker-compose.yml --profile otp up -d otp
  otp-build:
    image: opentripplanner/opentripplanner:2.10.0
    profiles: ["otp-build"]
    command: ["--build", "--save"]
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx${OTP_BUILD_HEAP:-5g}"
    volumes: &otp-volumes
      - ../data/otp:/var/opentripplanner
      - ./otp/build-config.json:/var/opentripplanner/build-config.json:ro
      - ./otp/router-config.json:/var/opentripplanner/router-config.json:ro
      - ./otp/otp-config.json:/var/opentripplanner/otp-config.json:ro

  otp:
    image: opentripplanner/opentripplanner:2.10.0
    profiles: ["otp"]
    command: ["--load", "--serve"]
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx${OTP_HEAP:-3g}"
    ports:
      - "127.0.0.1:8080:8080"   # localhost only; the API is the public entry point
    volumes: *otp-volumes

volumes:
  db-data:
