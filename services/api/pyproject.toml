[project]
name = "madridgo-api"
version = "0.1.0"
description = "MadridGo backend API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.4,<3.0",
  "asyncpg>=0.29,<1.0",
  "redis>=5.0,<7.0",
  "httpx>=0.27",      # feed downloads (also used by the test client)
  "tzdata>=2024.1",   # Europe/Madrid on systems without a zoneinfo database (Windows, slim images)
  "gtfs-realtime-bindings>=1.0",  # Renfe GTFS-RT protobuf
  "defusedxml>=0.7",  # EMT incidents RSS (untrusted XML)
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]  # asserts and fake credentials are fine in tests
# SQL here is composed only from module-level constants and integer feed-version ids;
# all user input goes through $n parameters.
"app/stops.py" = ["S608"]
"app/ingest/importer.py" = ["S608"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*", "google.transit", "google.transit.*", "defusedxml", "defusedxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs running PostGIS and Redis (docker compose); skipped unless MADRIDGO_INTEGRATION=1",
]

[tool.setuptools.package-data]
app = ["migrations/*.sql"]
